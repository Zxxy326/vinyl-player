/* ---- lyrics/lrc.js ---- */
/* LRC 解析 + 双语配对
   支持：[mm:ss.xx] / [mm:ss:xx] / 一行多时间戳 / [offset:±ms] / 元数据标签
   双语：同一时间戳（±80ms）的相邻两行，一行含中日韩字符、一行不含 → 配对成 en/cn */


const TAG = /\[([a-zA-Z#]+):([^\]]*)\]/g;
const TIME = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;

function toSec(m, s, f){
  let ms = 0;
  if (f != null){
    ms = f.length === 1 ? +f * 100 : f.length === 2 ? +f * 10 : +f;
  }
  return (+m) * 60 + (+s) + ms / 1000;
}

function parseLrc(text){
  if (!text) return [];
  const out = [];
  let offset = 0;
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');

  // 先扫一遍 offset
  for (const line of lines){
    TAG.lastIndex = 0;
    let m;
    while ((m = TAG.exec(line))){
      if (m[1].toLowerCase() === 'offset'){
        const v = parseInt(m[2], 10);
        if (!isNaN(v)) offset = v / 1000;
      }
    }
  }

  for (const raw of lines){
    TIME.lastIndex = 0;
    const times = [];
    let m;
    while ((m = TIME.exec(raw))){
      times.push(toSec(m[1], m[2], m[3]));
    }
    if (!times.length) continue;

    // 去掉所有 [..] 标签，剩下的就是正文
    const body = raw.replace(/\[[^\]]*\]/g, '').trim();
    if (!body) continue;

    for (const t of times){
      out.push({ t: Math.max(0, t - offset), text: body });
    }
  }

  out.sort((a, b) => a.t - b.t);

  // 同时间戳去重（保留第一条）
  const dedup = [];
  for (const e of out){
    const prev = dedup[dedup.length - 1];
    if (prev && Math.abs(prev.t - e.t) < 0.005 && prev.text === e.text) continue;
    dedup.push(e);
  }
  return dedup;
}

/* 纯文本歌词（无时间戳）→ 平均分配时间轴 */
function plainLyrics(text, duration){
  // 只按 \r\n 拆不够：ID3 的 USLT 帧里常见的是单独的 \r（老 Mac 换行）
  const rows = String(text || '').split(/\r\n?|\n/).map(s => s.trim()).filter(Boolean);
  if (!rows.length) return [];
  const dur = duration && duration > 4 ? duration : rows.length * 4;
  const start = Math.min(4, dur * .08);
  const span = Math.max(1, dur - start - 2);
  return rows.map((text, i) => ({ t: start + span * (i / rows.length), text }));
}

/* entries → 渲染行 {t, en, cn} */
function buildLines(entries){
  if (!entries || !entries.length) return [];
  const groups = [];
  for (const e of entries){
    const last = groups[groups.length - 1];
    if (last && Math.abs(last.t - e.t) <= 0.08) last.items.push(e);
    else groups.push({ t: e.t, items: [e] });
  }

  const lines = [];
  for (const g of groups){
    if (g.items.length === 1){
      const text = g.items[0].text;
      // 中文单语：放主行（大号衬线，中文回退到宋体），不占副行
      lines.push({ t: g.t, en: text, cn: '' });
      continue;
    }
    // 多行同时间戳：挑一条拉丁的当 en，一条 CJK 的当 cn
    let en = '', cn = '';
    for (const it of g.items){
      const cjk = hasCJK(it.text);
      if (cjk && !cn) cn = it.text;
      else if (!cjk && !en) en = it.text;
      else if (!cn) cn = it.text;
      else if (!en) en = it.text;
    }
    if (!en && cn){ en = cn; cn = ''; }
    lines.push({ t: g.t, en, cn });
  }
  return lines;
}

function lrcToLines(text, duration){
  const entries = parseLrc(text);
  if (entries.length) return buildLines(entries);
  const plain = plainLyrics(text, duration);
  return plain.length ? buildLines(plain) : [];
}

/* ---- audio/backend.js ---- */
/* 音频后端抽象
   桌面/Web 用 Web Audio（HTMLAudioElement + AnalyserNode）
   安卓用原生 Media3（ExoPlayer + 前台服务），通过 IPC 驱动

   约定：两端都往 bins 里填「已分好 56 个对数 bin、值域 0..255」的原始幅值，
   渲染层再套同一条曲线 —— 这样两端的频谱形态一致。 */
const BARS = 56;

class AudioBackend {
  constructor(){
    this.bins = new Uint8Array(BARS);
    this.live = false;        // 频谱数据是否真实可用
    this.ready = false;
  }

  async load(track, queue){ this.ready = true; return track; }
  async play(){}
  pause(){}
  seek(t){}
  setVolume(v){}
  next(){}
  prev(){}
  setShuffle(on){}
  setRepeat(mode){}

  /* 搓碟：begin → 多次 scratchTo → end
     rate 为「相对正常速度的倍率」，负值表示反向 */
  beginScratch(){}
  scratchTo(t, rate){ this.seek(t); }
  endScratch(t){ this.seek(t); }

  get time(){ return 0; }
  get duration(){ return 0; }
  get paused(){ return true; }

  /* 渲染循环里每帧调一次，拉取频谱（桌面）；安卓是推模式，这里空实现 */
  pull(){}

  destroy(){}
}

/* 对数分频：低频不被挤成一根柱子（与安卓 Kotlin 侧同一套公式） */
function buildBins(sampleRate, binCount){
  const nyq = sampleRate / 2;
  const fMin = 38;
  const fMax = Math.min(16500, nyq * .92);
  const out = [];
  for (let i = 0; i < BARS; i++){
    const f0 = fMin * Math.pow(fMax / fMin, i / BARS);
    const f1 = fMin * Math.pow(fMax / fMin, (i + 1) / BARS);
    let s = Math.floor(f0 / nyq * binCount);
    let e = Math.ceil(f1 / nyq * binCount);
    if (e <= s) e = s + 1;
    out.push([Math.min(s, binCount - 1), Math.min(e, binCount)]);
  }
  return out;
}

/* ---- audio/webaudio.js ---- */
/* 桌面 / Web 后端：HTMLAudioElement + Web Audio AnalyserNode */


class WebAudioBackend extends AudioBackend {
  constructor(audioEl){
    super();
    this.audio = audioEl;
    this.ctx = null;
    this.analyser = null;
    this.freq = null;
    this.map = null;
    this.broken = false;
    this._volume = .72;
    this.audio.volume = .72;
  }

  /* 必须在用户手势里调用：createMediaElementSource 会把输出重定向进音频图，
     context 若处于 suspended 就是全程静音 */
  ensureAnalyser(){
    if (this.analyser || this.broken) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.broken = true; return; }
    try {
      this.ctx = new AC();
      const src = this.ctx.createMediaElementSource(this.audio);
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 2048;
      this.analyser.smoothingTimeConstant = .72;
      src.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);
      this.freq = new Uint8Array(this.analyser.frequencyBinCount);
      this.map = buildBins(this.ctx.sampleRate, this.analyser.frequencyBinCount);
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    } catch (e){
      this.broken = true;
      this.analyser = null;
    }
  }

  resumeCtx(){
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  }

  async load(track){
    this.ready = false;
    this.live = false;
    this.bins.fill(0);
    const a = this.audio;
    a.src = track.src;
    a.load();
    await new Promise((resolve) => {
      let done = false;
      const timer = setTimeout(finish, 8000);
      function finish(){
        if (done) return;
        done = true;
        clearTimeout(timer);
        a.removeEventListener('loadedmetadata', finish);
        a.removeEventListener('error', finish);
        resolve();
      }
      a.addEventListener('loadedmetadata', finish);
      a.addEventListener('error', finish);
    });
    this.ready = true;
    return track;
  }

  async play(){
    this.resumeCtx();
    try { await this.audio.play(); return true; }
    catch (e){ return false; }
  }

  pause(){ try { this.audio.pause(); } catch (_) {} }

  seek(t){
    const d = this.duration;
    const v = Math.min(d > 0 ? d : t, Math.max(0, t));
    if (this.audio.readyState >= 1) this.audio.currentTime = v;
  }

  /* 桌面端每次移动直接写 currentTime：高频 seek 本身就是刮擦声（原有手感） */
  beginScratch(){
    if (!this.audio.paused){ const p = this.audio.play(); if (p && p.catch) p.catch(() => {}); }
  }
  scratchTo(t){ this.seek(t); }
  endScratch(t){ this.seek(t); }

  setVolume(v){ this._volume = v; this.audio.volume = v; }

  get time(){ return this.audio.currentTime || 0; }
  get duration(){
    const d = this.audio.duration;
    return isFinite(d) && d > 0 ? d : 0;
  }
  get paused(){ return this.audio.paused; }

  pull(){
    if (!this.analyser || this.broken || this.audio.paused){ return; }
    const a = this.analyser;
    a.getByteFrequencyData(this.freq);
    let peak = 0;
    for (let i = 0; i < this.freq.length; i++) if (this.freq[i] > peak) peak = this.freq[i];
    if (peak > 0){
      this.live = true;
      for (let i = 0; i < BARS; i++){
        const [s, e] = this.map[i];
        let m = 0;
        for (let b = s; b < e; b++) if (this.freq[b] > m) m = this.freq[b];
        this.bins[i] = m;
      }
    }
  }

  destroy(){
    this.pause();
    this.audio.removeAttribute('src');
  }
}

/* ---- audio/media3.js ---- */
/* 安卓后端：原生 Media3（ExoPlayer）+ 前台服务
   时间用「Kotlin 每 250ms 推一次 position + JS 插值」，
   避免每帧一次跨语言往返。频谱由 Kotlin 推 56 个 bin。 */



function inv(cmd, args){
  if (ANDROID){
    try {
      const raw = ANDROID[cmd](JSON.stringify(args || {}));
      return Promise.resolve(raw ? JSON.parse(raw) : null);
    } catch (e){
      return Promise.resolve(null);
    }
  }
  return window.__TAURI__.core.invoke('plugin:player|' + cmd, args || {});
}

class Media3Backend extends AudioBackend {
  constructor(){
    super();
    this._pos = 0;
    this._dur = 0;
    this._paused = true;
    this._posAt = performance.now();
    this._rate = 1;
    this._base = 0;
    this._pending = 0;
    this._lastSeekAt = 0;
    this._vol = .72;
  }

  async load(track, queue){
    this.ready = false;
    this.bins.fill(0);
    this.live = false;
    this._pos = 0;
    this._dur = track.duration || 0;
    this._paused = true;
    this._posAt = performance.now();

    const list = (queue && queue.length ? queue : [track]).map((t) => ({
      id: t.id || '',
      uri: t.uri || t.src || '',
      title: t.title || '',
      artist: t.artist || '',
      album: t.album || '',
      albumId: t.albumId != null ? String(t.albumId) : ''
    }));
    const index = Math.max(0, list.findIndex((t) => t.id === track.id));

    await inv('load', { index, queue: list });
    await inv('volume', { level: this._vol });
    this.ready = true;
  }

  async play(){ await inv('play'); this._paused = false; this._posAt = performance.now(); }
  pause(){ inv('pause'); this._paused = true; this._pos = this.time; this._posAt = performance.now(); }
  seek(t){
    const v = Math.max(0, t);
    this._pos = v; this._posAt = performance.now();
    this._base = v; this._pending = 0;
    inv('seek', { position: v });
  }

  next(){ inv('next'); }
  prev(){ inv('prev'); }
  setShuffle(on){ inv('shuffle', { on: !!on }); }
  setRepeat(mode){ inv('repeat', { mode: mode }); }

  beginScratch(){
    this._base = this.time;
    this._pending = 0;
    this._lastSeekAt = 0;
    if (!this._paused) inv('play');
  }

  /* 正向：变速弯音（varispeed，音高跟着变）→ 偏移超过 0.45s 才提交一次 seek
     反向：Media3 不能倒放，退化为限流 seek（25Hz） */
  scratchTo(t, rate){
    this._pending = t - this._base;
    if (rate > .3 && Math.abs(this._pending) < .45){
      inv('bend', { rate: Math.min(2.2, Math.max(.25, rate)) });
      return;
    }
    inv('bend', { rate: 0 });
    const now = performance.now();
    if (now - this._lastSeekAt > 42){
      this._lastSeekAt = now;
      this._base = t;
      this._pending = 0;
      this._pos = t; this._posAt = now;
      inv('seek', { position: t });
    }
  }

  endScratch(t){
    inv('bend', { rate: 0 });
    this._base = t; this._pending = 0;
    this._pos = t; this._posAt = performance.now();
    inv('seek', { position: t });
  }

  setVolume(v){
    this._vol = v;
    if (this.ready) inv('volume', { level: v });
  }

  get time(){
    if (this._paused) return this._pos;
    return this._pos + (performance.now() - this._posAt) / 1000 * this._rate;
  }
  get duration(){ return this._dur || 0; }
  get paused(){ return this._paused; }

  /* ---- 以下是 Kotlin 事件回调 ---- */
  onPosition(pos, dur, playing){
    this._pos = pos;
    this._dur = dur || this._dur;
    this._paused = !playing;
    this._posAt = performance.now();
    if (this._rate !== 1 && !playing) this._rate = 1;
  }
  onSpectrum(arr){
    if (!arr || !arr.length) return;
    let peak = 0;
    for (let i = 0; i < BARS; i++){
      const v = arr[i] | 0;
      this.bins[i] = v;
      if (v > peak) peak = v;
    }
    this.live = peak > 0;
  }
  onState(state){
    if (state === 'playing'){ this._paused = false; this._posAt = performance.now(); }
    else if (state === 'paused' || state === 'ended' || state === 'idle'){
      this._paused = true; this._pos = this.time; this._posAt = performance.now();
    }
  }

  destroy(){ inv('stop'); }
}

/* ---- core/platform.js ---- */
/* 平台适配层：三端只在这里分叉，UI 层不感知平台 */



const HAS_TAURI = typeof window !== 'undefined' && !!window.__TAURI_INTERNALS__;
const IS_ANDROID = HAS_ANDROID || (HAS_TAURI && /android/i.test(navigator.userAgent || ''));
const IS_DESKTOP = HAS_TAURI && !IS_ANDROID;
const IS_WEB = !HAS_TAURI && !HAS_ANDROID;

function invoke(cmd, args){
  return window.__TAURI__.core.invoke(cmd, args || {});
}
function pinvoke(cmd, args){
  return window.__TAURI__.core.invoke('plugin:player|' + cmd, args || {});
}
function convertFileSrc(p){
  try { return window.__TAURI__.core.convertFileSrc(p); } catch (_) { return p; }
}
function listen(ev, cb){
  if (!HAS_TAURI) return Promise.resolve(() => {});
  return window.__TAURI__.event.listen(ev, (e) => cb(e.payload));
}

const AUDIO_EXT = ['mp3', 'flac', 'm4a', 'aac', 'wav', 'ogg', 'oga', 'opus', 'wma', 'aiff', 'aif', 'alac', 'ape', 'dsf', 'dff', 'mp2', 'caf'];
function extOf(name){
  const m = /\.([^.\\/]+)$/.exec(name || '');
  return m ? m[1].toLowerCase() : '';
}

/* ---------------- Web：目录选择（File System Access 的降级路径） ---------------- */
function pickDirectoryWeb(){
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.multiple = true;
    inp.webkitdirectory = true;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => {
      const files = Array.from(inp.files || []);
      inp.remove();
      resolve(files);
    }, { once: true });
    inp.click();
  });
}

function probeDuration(src){
  return new Promise((resolve) => {
    const a = new Audio();
    let done = false;
    const finish = (v) => { if (done) return; done = true; a.src = ''; resolve(v); };
    const timer = setTimeout(() => finish(0), 4000);
    a.addEventListener('loadedmetadata', () => {
      clearTimeout(timer);
      finish(isFinite(a.duration) ? a.duration : 0);
    }, { once: true });
    a.addEventListener('error', () => { clearTimeout(timer); finish(0); }, { once: true });
    a.preload = 'metadata';
    a.src = src;
  });
}

async function scanWeb(files){
  const lrcMap = new Map();
  const imgMap = new Map();
  const audio = [];

  for (const f of files){
    const rel = f.webkitRelativePath || f.name;
    const dir = rel.replace(/[^\\/]+$/, '');
    const base = rel.replace(/\.[^.]+$/, '').toLowerCase();
    const ext = extOf(f.name);
    if (ext === 'lrc') lrcMap.set(base, f);
    else if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)){
      const key = (dir + f.name.replace(/\.[^.]+$/, '')).toLowerCase();
      if (!imgMap.has(key)) imgMap.set(key, f);
      imgMap.set((dir + 'cover').toLowerCase(), f);
      imgMap.set((dir + 'folder').toLowerCase(), f);
      imgMap.set((dir + 'front').toLowerCase(), f);
    } else if (AUDIO_EXT.includes(ext)) audio.push(f);
  }

  const tracks = [];
  for (let i = 0; i < audio.length; i++){
    const f = audio[i];
    const rel = f.webkitRelativePath || f.name;
    const base = rel.replace(/\.[^.]+$/, '').toLowerCase();
    const g = guessMeta(f.name);
    const src = URL.createObjectURL(f);
    const dur = await probeDuration(src);
    const lrcFile = lrcMap.get(base);
    const img = imgMap.get(base) || imgMap.get((rel.replace(/[^\\/]+$/, '') + 'cover').toLowerCase());
    tracks.push({
      id: 'web:' + rel,
      title: g.title || f.name,
      artist: g.artist || '未知艺人',
      album: rel.replace(/[^\\/]+$/, '').replace(/[\\/]$/, '') || '',
      duration: dur,
      src,
      format: extOf(f.name).toUpperCase(),
      playable: true,
      lrc: lrcFile ? await lrcFile.text() : '',
      artUrl: img ? URL.createObjectURL(img) : ''
    });
  }
  return tracks;
}

/* ---------------- 桌面：Rust 扫描 ---------------- */
async function scanDesktop(dir){
  const res = await invoke('scan_library', { dir });
  const tracks = (res.tracks || []).map(t => Object.assign({}, t, {
    id: 'file:' + t.path,
    src: '',
    artUrl: ''
  }));
  return { dir: res.dir || dir, tracks };
}

/* ---------------- 安卓：MediaStore（原生桥） ---------------- */
async function scanAndroid(){
  let list = null;
  if (HAS_ANDROID){
    try {
      list = acallJSON('library');
    } catch (e){
      console.log('[vinyl] library() 调用失败: ' + (e && e.message));
      list = null;
    }
    console.log('[vinyl] library() 返回 ' + (Array.isArray(list) ? list.length : 'null') + ' 首');
  }
  else {
    try { list = await pinvoke('library'); } catch (_) { list = null; }
  }
  return (list || []).map(t => Object.assign({}, t, {
    id: 'media:' + t.uri,
    src: t.uri
  }));
}

/* ---------------- 对外接口 ---------------- */
async function pickLibrary(){
  if (IS_DESKTOP){
    const res = await invoke('pick_and_scan');
    if (!res || !res.tracks) return null;
    return { dir: res.dir, tracks: res.tracks.map(t => Object.assign({}, t, { id: 'file:' + t.path, src: '' })) };
  }
  if (IS_ANDROID){
    return { dir: '', tracks: await scanAndroid() };
  }
  const files = await pickDirectoryWeb();
  if (!files.length) return null;
  return { dir: '', tracks: await scanWeb(files) };
}

async function rescan(dir){
  if (IS_DESKTOP && dir){
    const r = await scanDesktop(dir);
    return { dir: r.dir, tracks: r.tracks };
  }
  if (IS_ANDROID) return { dir: '', tracks: await scanAndroid() };
  return null;
}

/* 播放前把 track.src 准备好（桌面可能需要转码） */
async function resolvePlayable(track){
  if (IS_DESKTOP){
    const r = await invoke('prepare_playback', { path: track.path });
    if (!r || r.error) throw new Error(r && r.error ? r.error : '无法播放');
    track.src = convertFileSrc(r.path);
    track.transcoded = !!r.transcoded;
    if (r.duration) track.duration = r.duration;
    return track;
  }
  if (IS_ANDROID) return track;
  return track;
}

async function loadLyrics(track){
  if (track.lrc) return track.lrc;
  if (IS_DESKTOP && track.path){
    try { return await invoke('read_lyrics', { path: track.path }) || ''; } catch (_) { return ''; }
  }
  if (IS_ANDROID){
    if (HAS_ANDROID) return acall('lyrics', { uri: track.uri || '' }) || '';
    try { return await pinvoke('lyrics', { uri: track.uri || '' }) || ''; } catch (_) { return ''; }
  }
  return '';
}

function importLyrics(track){
  if (!IS_ANDROID) return Promise.resolve('');
  return new Promise((resolve) => {
    let done = false;
    const finish = (text) => {
      if (done) return;
      done = true;
      window.__onLyrics = null;
      const t = text || '';
      if (t){
        track.lrc = t;
        try {
          const map = JSON.parse(localStorage.getItem('vinyl-player/lrc') || '{}');
          map[track.id] = t;
          localStorage.setItem('vinyl-player/lrc', JSON.stringify(map));
        } catch (_) {}
      }
      resolve(t);
    };
    window.__onLyrics = finish;
    if (HAS_ANDROID) acall('pickLyrics');
    else pinvoke('pick_lyrics').then((t) => finish(t || '')).catch(() => finish(''));
    setTimeout(() => finish(''), 180000);
  });
}

function restoreImportedLyrics(track){
  try {
    const map = JSON.parse(localStorage.getItem('vinyl-player/lrc') || '{}');
    if (map[track.id]) track.lrc = map[track.id];
  } catch (_) {}
  return track;
}

/* 当前歌词行推给原生（通知栏 / 锁屏副标题）。只有安卓原生壳有这条路。 */
function setNowLyric(text){
  if (!IS_ANDROID || !HAS_ANDROID) return;
  try { acall('lyric', { text: text || '' }); } catch (_) {}
}

async function loadCover(track){
  if (track.artUrl) return track.artUrl;
  try {
    if (IS_DESKTOP && track.path){
      const b64 = await invoke('read_cover', { path: track.path });
      if (b64) return 'data:image/jpeg;base64,' + b64;
    } else if (IS_ANDROID){
      // 安卓：原生侧先掏内嵌图片，没有再退回专辑封面
      const args = { albumId: track.albumId == null ? '' : String(track.albumId), uri: track.uri || '' };
      const raw = HAS_ANDROID ? acall('cover', args) : await pinvoke('cover', args);
      if (raw){
        // 安卓返回 {mime, data}：MIME 必须照抄，封面可能是 PNG / WebP
        if (typeof raw === 'string' && raw.charAt(0) === '{'){
          try {
            const o = JSON.parse(raw);
            if (o && o.data) return 'data:' + (o.mime || 'image/jpeg') + ';base64,' + o.data;
          } catch (_) {}
        }
        return 'data:image/jpeg;base64,' + raw;
      }
    }
  } catch (_) {}
  return '';
}

/* ---- ui/disc.js ---- */
/* 唱片：旋转 / 惯性 / 搓碟手势
   旋转角度由 JS 统一驱动（不能用 CSS animation —— 拖拽接管后松手会从 0deg 重来，画面会跳） */


class Disc {
  constructor({ platter, discEl, backend, hooks }){
    this.platter = platter;
    this.discEl = discEl;
    this.backend = backend;
    this.hooks = hooks || {};

    this.SPIN_PERIOD = 22;   // 视觉转速：22 秒一圈
    this.SEC_PER_TURN = 6;   // 搓碟换算：手转一圈 = 音轨前后 6 秒

    this.angle = 0;
    this.boost = 0;
    this.scratching = false;
    this.wasPlaying = false;
    this.ptrId = null;
    this.moved = 0;
    this.vel = 0;
    this.aLast = 0;
    this.tLast = 0;

    this._bind();
  }

  tick(dt, playing){
    if (!this.scratching){
      if (playing) this.angle += 360 / this.SPIN_PERIOD * dt;
      if (this.boost){
        this.angle += this.boost * dt;
        this.boost *= Math.pow(0.012, dt);
        if (Math.abs(this.boost) < 2) this.boost = 0;
      }
    }
    this.discEl.style.transform = 'rotate(' + this.angle + 'deg)';
  }

  _angle(e){
    const r = this.platter.getBoundingClientRect();
    return Math.atan2(
      e.clientY - (r.top + r.height / 2),
      e.clientX - (r.left + r.width / 2)
    ) * 180 / Math.PI;
  }

  _bind(){
    const pl = this.platter;

    pl.addEventListener('pointerdown', (e) => {
      if (e.button) return;
      e.preventDefault();
      const h = this.hooks;
      if (h.ensureAudio) h.ensureAudio();

      this.scratching = true;
      this.wasPlaying = !!h.isPlaying();
      this.ptrId = e.pointerId;
      this.moved = 0;
      this.vel = 0;
      this.boost = 0;
      this.aLast = this._angle(e);
      this.tLast = performance.now();

      document.body.classList.add('is-scratching');
      this.backend.beginScratch();
      try { pl.setPointerCapture(this.ptrId); } catch (_) {}
      if (h.onScratch) h.onScratch(0, h.getTime());
    });

    pl.addEventListener('pointermove', (e) => {
      if (!this.scratching || e.pointerId !== this.ptrId) return;
      const h = this.hooks;

      const a = this._angle(e);
      let d = a - this.aLast;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      this.aLast = a;
      if (!d) return;

      const now = performance.now();
      const dtm = Math.max(0.008, (now - this.tLast) / 1000);
      this.tLast = now;
      this.vel = this.vel * 0.6 + (d / dtm) * 0.4;

      this.moved += Math.abs(d);
      this.angle += d;

      const t = clamp(h.getTime() + d / 360 * this.SEC_PER_TURN, 0, h.getDuration() || 1e9);
      h.setTime(t);

      // 角速度 → 倍速：手转一圈 / 6 秒 = 正常速度
      const rate = this.vel * this.SEC_PER_TURN / 360;
      this.backend.scratchTo(t, rate);

      if (h.onScratch) h.onScratch(d, t);
    });

    const end = () => {
      if (!this.scratching) return;
      const h = this.hooks;
      this.scratching = false;
      document.body.classList.remove('is-scratching');
      try { pl.releasePointerCapture(this.ptrId); } catch (_) {}

      const t = h.getTime();
      this.backend.endScratch(t);

      if (this.moved < 2){
        this.boost = 0;
        if (h.togglePlay) h.togglePlay();
      } else {
        this.boost = clamp(this.vel * 0.55, -1500, 1500);
        if (h.restorePlay) h.restorePlay(this.wasPlaying);
      }
      if (h.onScratchEnd) h.onScratchEnd();
    };

    pl.addEventListener('pointerup', end);
    pl.addEventListener('pointercancel', end);
  }
}

/* ---- ui/lyricsView.js ---- */
/* 歌词视图：滚动 / 高亮 / 点行跳转 */


class LyricsView {
  constructor({ viewport, track, onSeek }){
    this.viewport = viewport;
    this.track = track;
    this.onSeek = onSeek;
    this.lines = [];
    this.els = [];
    this.active = -1;
    this.signature = '';

    // 布局稳定后重新居中：首帧 clientHeight 可能是 0，
    // 只在 setActive 时算一次会永远停在顶部（原版的既有问题）
    if (window.ResizeObserver){
      this._ro = new ResizeObserver(() => { if (this.active >= 0) this.center(); });
      this._ro.observe(this.viewport);
    }
    if (document.fonts && document.fonts.ready){
      document.fonts.ready.then(() => { if (this.active >= 0) this.center(); }).catch(() => {});
    }
  }

  setLines(lines){
    this.lines = lines || [];
    this.active = -1;
    this.signature = this.lines.map(l => l.t + '|' + l.en + '|' + l.cn).join('\n');
    this.track.innerHTML = '';
    this.els = [];

    const frag = document.createDocumentFragment();
    this.lines.forEach((l, i) => {
      const el = document.createElement('div');
      el.className = 'lyric';
      el.innerHTML = '<div class="en">' + esc(l.en) + '</div>' +
                     (l.cn ? '<div class="cn">' + esc(l.cn) + '</div>' : '');
      el.addEventListener('click', () => { if (this.onSeek) this.onSeek(l.t + 0.01); });
      frag.appendChild(el);
      this.els.push(el);
    });
    this.track.appendChild(frag);
  }

  get hasLines(){ return this.lines.length > 0; }

  indexAt(t){
    if (!this.lines.length) return -1;
    let idx = 0;
    for (let i = 0; i < this.lines.length; i++) if (t >= this.lines[i].t) idx = i;
    return idx;
  }

  setActive(i){
    if (i === this.active) return;
    this.active = i;
    this.els.forEach((el, k) => {
      const d = Math.abs(k - i);
      el.style.setProperty('--o', d === 0 ? 1 : d === 1 ? .40 : d === 2 ? .22 : .11);
      el.classList.toggle('is-active', k === i);
    });
    this.center();
    // 把当前这句推给原生（通知栏/锁屏显示正在唱哪一句）
    if (typeof this.onLine === 'function'){
      const l = this.lines[i];
      this.onLine(l ? (l.en || l.cn || '') : '');
    }
  }

  center(){
    const el = this.els[this.active];
    if (!el) return;
    const y = el.offsetTop + el.offsetHeight / 2 - this.viewport.clientHeight / 2;
    this.track.style.transform = 'translate3d(0, ' + (-y) + 'px, 0)';
  }

  /* 主动 seek 时立即定位，不等过渡 */
  snapTo(t){
    const i = this.indexAt(t);
    if (i < 0) return;
    this.setActive(i);
  }
}

/* ---- ui/spectrum.js ---- */
/* 频谱：56 根对数分频柱
   数据来自 backend.bins（0..255）；取不到真实频谱时退化为程序化波形，且能自动恢复 */


class Spectrum {
  constructor({ canvas, backend }){
    this.canvas = canvas;
    this.g = canvas.getContext('2d');
    this.backend = backend;
    this.wrap = canvas.parentElement;
    this.vals = new Float32Array(BARS);
    this.w = 0; this.h = 0; this.dpr = 1;
    this.silent = 0;
    this.dataOK = true;
    this.low = false;
    this.gain = 1;          // 自适应增益（跟随峰值，见 draw）
    this.raw = null;        // 本帧原始能量，复用避免每帧分配
    this._ro = null;
    if (window.ResizeObserver){
      this._ro = new ResizeObserver(() => this.size());
      this._ro.observe(this.wrap);
    }
    window.addEventListener('resize', () => this.size());
  }

  setLow(low){ this.low = low; }

  size(){
    const r = this.wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    this.dpr = Math.min(this.low ? 1.5 : 2, window.devicePixelRatio || 1);
    this.w = r.width; this.h = r.height;
    this.canvas.width = Math.round(this.w * this.dpr);
    this.canvas.height = Math.round(this.h * this.dpr);
    this.g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }

  draw(playing){
    if (!this.w || !this.h){ this.size(); if (!this.w) return; }
    const g = this.g;
    const baseY = this.h * 0.80;
    const topPad = 8;
    g.clearRect(0, 0, this.w, this.h);

    // 网格
    g.strokeStyle = 'rgba(246,234,217,.055)';
    g.lineWidth = 1;
    for (let k = 1; k <= 3; k++){
      const y = Math.round(baseY - (baseY - topPad) * k / 3) + 0.5;
      g.beginPath(); g.moveTo(0, y); g.lineTo(this.w, y); g.stroke();
    }
    // 基线
    g.strokeStyle = 'rgba(246,234,217,.26)';
    g.beginPath(); g.moveTo(0, baseY + 0.5); g.lineTo(this.w, baseY + 0.5); g.stroke();

    const be = this.backend;
    const liveData = playing && be.live && !be.broken;

    // 连续 2 秒全零才判定取不到数据（乐曲里的安静段落不能把可视化永久打成假的）
    if (playing && be.live){
      let peak = 0;
      for (let i = 0; i < BARS; i++) if (be.bins[i] > peak) peak = be.bins[i];
      if (peak > 0){ this.silent = 0; this.dataOK = true; }
      else if (++this.silent > 120) this.dataOK = false;
    }

    const useLive = liveData && this.dataOK;
    const count = this.low ? 32 : BARS;
    const gap = Math.max(2, this.w / count * 0.34);
    const bw = (this.w - gap * (count - 1)) / count;
    const now = performance.now() / 1000;
    const span = baseY - topPad;

    /* 第一遍：算本帧每根柱子的原始能量（未归一化）
       以前这里乘了个 (1 + 1.15*i/BARS) 的高频补偿，高频一根比一根高，
       几乎每帧都有大半排捅到 1.0 —— 就是"全都顶满"的来源。
       现在只给 0~30% 的轻微抬升，真正的幅度交给下一步的自适应增益。 */
    const raw = this.raw && this.raw.length === count ? this.raw : (this.raw = new Float32Array(count));

    if (useLive){
      for (let i = 0; i < count; i++){
        const srcIdx = this.low ? Math.round(i * BARS / count) : i;
        const m = be.bins[Math.min(BARS - 1, srcIdx)];
        const tilt = 1 + 0.3 * (srcIdx / BARS);
        raw[i] = Math.pow(m / 255, 0.72) * tilt;
      }
    } else if (playing){
      for (let i = 0; i < count; i++){
        const a  = Math.abs(Math.sin(now * 1.7 + i * 0.71));
        const b2 = Math.abs(Math.sin(now * 0.93 + i * 0.23));
        const c  = Math.abs(Math.sin(now * 3.1 + i * 1.31));
        const tilt = 1 - 0.5 * Math.pow(i / count, 0.8);
        raw[i] = (0.06 + (a * 0.55 + b2 * 0.3 + c * 0.15) * 0.9) * tilt;
      }
    } else {
      raw.fill(0);
    }

    /* 横向 3 点平滑：相邻柱子一高一低会像梳子，平滑一遍更像真的电平表 */
    let prevRaw = raw[0];
    for (let i = 1; i < count - 1; i++){
      const cur = raw[i];
      raw[i] = prevRaw * 0.25 + cur * 0.5 + raw[i + 1] * 0.25;
      prevRaw = cur;
    }

    /* 第二遍：自适应增益。让本帧最高的一根稳定落在 ~0.85 高度，
       而不是让所有柱子各自去撞天花板。增益下降快、上升慢（跟压缩器一样）。 */
    let peak = 0;
    for (let i = 0; i < count; i++) if (raw[i] > peak) peak = raw[i];
    const want = peak > 0.02 ? Math.min(4, 1.35 / peak) : 1;
    const k = want < this.gain ? 0.22 : 0.07;
    this.gain += (want - this.gain) * k;
    if (!isFinite(this.gain) || this.gain <= 0) this.gain = 1;

    for (let i = 0; i < count; i++){
      // tanh 软饱和：越接近满格压得越狠，柱顶就不会齐刷刷排成一条线
      const target = Math.min(1, Math.tanh(raw[i] * this.gain) * 0.96);
      const v = this.vals[i];
      this.vals[i] = v + (target - v) * (target > v ? 0.55 : 0.14);
      if (this.vals[i] < 0.003) this.vals[i] = 0;

      const x = i * (bw + gap);
      const h = Math.max(1.5, this.vals[i] * span);

      g.fillStyle = 'rgba(250,240,226,' + (0.28 + 0.64 * this.vals[i]).toFixed(3) + ')';
      g.beginPath();
      if (g.roundRect) g.roundRect(x, baseY - h, bw, h, Math.min(bw / 2, 3));
      else g.rect(x, baseY - h, bw, h);
      g.fill();

      g.globalAlpha = 0.1;
      g.fillRect(x, baseY + 2, bw, Math.min(h * 0.22, this.h - baseY - 6));
      g.globalAlpha = 1;
    }
  }
}

/* ---- ui/transport.js ---- */
/* 传输栏：进度条 / 播放键 / 音量 / 随机 / 循环 */


class Transport {
  constructor(o){
    this.bar = o.bar;
    this.fill = o.fill;
    this.dot = o.dot;
    this.tCur = o.tCur;
    this.tDur = o.tDur;
    this.playBtn = o.playBtn;
    this.vol = o.vol;
    this.volKnob = o.volKnob;
    this.shuffleBtn = o.shuffleBtn;
    this.repeatBtn = o.repeatBtn;
    this.repeatBadge = o.repeatBadge;
    this.hooks = o.hooks;

    this._bind();
  }

  _bind(){
    const h = this.hooks;
    const bar = this.bar;

    const seekAt = (clientX) => {
      const r = bar.getBoundingClientRect();
      const p = clamp((clientX - r.left) / r.width, 0, 1);
      h.onSeek(p * (h.getDuration() || 0));
    };

    let dragging = false;
    bar.addEventListener('pointerdown', (e) => {
      dragging = true;
      try { bar.setPointerCapture(e.pointerId); } catch (_) {}
      if (h.onScrubStart) h.onScrubStart();
      seekAt(e.clientX);
    });
    bar.addEventListener('pointermove', (e) => { if (dragging) seekAt(e.clientX); });
    const stop = () => {
      if (!dragging) return;
      dragging = false;
      if (h.onScrubEnd) h.onScrubEnd();
    };
    bar.addEventListener('pointerup', stop);
    bar.addEventListener('pointercancel', stop);

    this.playBtn.addEventListener('click', () => {
      if (h.ensureAudio) h.ensureAudio();
      h.onTogglePlay();
    });

    this.vol.addEventListener('input', () => {
      const v = this.vol.value / 100;
      this.setVolume(v);
      if (h.onVolume) h.onVolume(v);
    });

    this.shuffleBtn.addEventListener('click', () => h.onShuffle());
    this.repeatBtn.addEventListener('click', () => h.onRepeat());
  }

  update(t, dur, playing){
    const d = dur || 0;
    const p = d > 0 ? clamp(t / d, 0, 1) : 0;
    this.fill.style.width = (p * 100) + '%';
    this.dot.style.left = (p * 100) + '%';
    this.tCur.textContent = fmt(t);
    this.tDur.textContent = fmt(d);
    this.playBtn.setAttribute('aria-label', playing ? '暂停' : '播放');
  }

  setVolume(v){
    this.vol.value = Math.round(v * 100);
    this.volKnob.style.setProperty('--r', (-120 + v * 240) + 'deg');
  }

  setShuffle(on){
    this.shuffleBtn.classList.toggle('on', !!on);
  }

  setRepeat(mode){
    this.repeatBtn.classList.toggle('on', mode !== 'off');
    if (this.repeatBadge) this.repeatBadge.hidden = mode !== 'one';
    this.repeatBtn.setAttribute('aria-label',
      mode === 'one' ? '单曲循环' : mode === 'all' ? '列表循环' : '不循环');
    this.repeatBtn.title = mode === 'one' ? '单曲循环' : mode === 'all' ? '列表循环' : '不循环';
  }
}

/* ---- ui/library.js ---- */
/* 音乐库抽屉：歌曲 / 专辑 / 艺术家 / 歌单 / 设置 五个页签
   所有页面共用一份曲库数据，切页签只重绘不重新扫描。 */




const TABS = ['tracks', 'albums', 'artists', 'playlists', 'settings'];

class Library {
  constructor(o){
    this.sheet = o.sheet;
    this.scrim = o.scrim;
    this.list = o.list;
    this.count = o.count;
    this.hint = o.hint;
    this.pickBtn = o.pickBtn;
    this.rescanBtn = o.rescanBtn;
    this.lrcBtn = o.lrcBtn;
    this.closeBtn = o.closeBtn;
    this.tabsEl = o.tabs;
    this.titleEl = o.title;
    this.panes = o.panes || {};
    this.lists = o.lists || {};
    this.hooks = o.hooks;

    this.tracks = [];
    this.index = -1;
    this.playing = false;
    this.open_ = false;
    this.tab = 'tracks';
    this.drill = null;      // { kind:'album'|'artist'|'playlist', key, name }
    this.playlists = [];
    this.libraryInfo = {};
    this.query = '';
    this.view = 'lyrics';
    this.volume = .72;
    this.keepOn = false;
    this.hideBar = false;

    this.searchInput = o.searchInput || null;
    this.searchClear = o.searchClear || null;

    this.pickBtn.addEventListener('click', () => this.hooks.onPick());
    this.rescanBtn.addEventListener('click', () => this.hooks.onRescan());
    this.closeBtn.addEventListener('click', () => this.close());
    this.scrim.addEventListener('click', () => this.close());
    if (this.lrcBtn) this.lrcBtn.addEventListener('click', () => this.hooks.onImportLyrics());
    if (o.newPlBtn) o.newPlBtn.addEventListener('click', () => this.hooks.onCreatePlaylist());

    if (this.searchInput){
      this.searchInput.addEventListener('input', () => this.setQuery(this.searchInput.value));
      this.searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape'){
          e.stopPropagation();
          if (this.query) this.setQuery('');
          else this.close();
        } else if (e.key === 'Enter'){
          e.preventDefault();
          this.searchInput.blur();
          const first = this.list.querySelector('.tr:not(.unsupported)');
          if (first) first.click();
        }
      });
    }
    if (this.searchClear){
      this.searchClear.addEventListener('click', () => {
        this.setQuery('');
        if (this.searchInput) this.searchInput.focus();
      });
    }

    this.tabsEl.addEventListener('click', (e) => {
      const b = e.target.closest('.tab');
      if (!b) return;
      this.setTab(b.dataset.tab);
    });

    this.list.addEventListener('click', (e) => this.onListClick(e));
    this.lists.albums.addEventListener('click', (e) => this.onGroupClick(e, 'album'));
    this.lists.artists.addEventListener('click', (e) => this.onGroupClick(e, 'artist'));
    this.lists.playlists.addEventListener('click', (e) => this.onPlaylistClick(e));
    this.lists.settings.addEventListener('click', (e) => this.onSettingsClick(e));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && this.open_){
        if (this.drill){ this.drill = null; this.redraw(); }
        else this.close();
      }
    });
  }

  get isOpen(){ return this.open_; }

  open(){
    this.open_ = true;
    this.sheet.classList.add('open');
    this.scrim.classList.add('open');
    this.sheet.setAttribute('aria-hidden', 'false');
    const cur = this.list.querySelector('.tr.is-cur');
    if (cur) cur.scrollIntoView({ block: 'center' });
  }

  close(){
    this.open_ = false;
    this.sheet.classList.remove('open');
    this.scrim.classList.remove('open');
    this.sheet.setAttribute('aria-hidden', 'true');
  }

  toggle(){ this.open_ ? this.close() : this.open(); }

  setBusy(busy){
    this.pickBtn.disabled = busy;
    this.rescanBtn.disabled = busy;
    this.hint.textContent = busy ? '正在扫描…' : '';
  }

  setTab(name){
    if (!TABS.includes(name)) return;
    this.tab = name;
    this.drill = null;
    for (const b of this.tabsEl.children) b.classList.toggle('on', b.dataset.tab === name);
    for (const k of TABS) this.panes[k].classList.toggle('on', k === name);
    this.redraw();
  }

  /* ---------------- 搜索 ---------------- */

  /* 标题 / 艺人 / 专辑 / 文件名，任意命中即可 */
  match(t){
    const q = this.query;
    if (!q) return true;
    return (t.title || '').toLowerCase().includes(q) ||
           (t.artist || '').toLowerCase().includes(q) ||
           (t.album || '').toLowerCase().includes(q) ||
           (t.format || '').toLowerCase().includes(q);
  }

  filtered(){
    return this.query ? this.tracks.filter(t => this.match(t)) : this.tracks;
  }

  setQuery(q){
    const v = (q || '').trim().toLowerCase();
    if (v === this.query){
      if (this.searchClear) this.searchClear.hidden = !v;
      return;
    }
    this.query = v;
    if (this.searchClear) this.searchClear.hidden = !v;
    if (this.searchInput && this.searchInput.value.trim().toLowerCase() !== v){
      this.searchInput.value = q || '';
    }
    // 搜索只在歌曲/专辑/艺术家三页有意义，停在设置页时顺手切回歌曲
    if (v && (this.tab === 'settings' || this.tab === 'playlists')) this.setTab('tracks');
    else this.redraw();
  }

  focusSearch(){
    if (this.searchInput) this.searchInput.focus();
  }

  /* ---------------- 数据入口 ---------------- */

  render(tracks, index, playing, opts){
    this.tracks = tracks || [];
    this.index = index;
    this.playing = !!playing;
    this.opts = opts || {};
    if (this.opts.playlists) this.playlists = this.opts.playlists;
    if (this.opts.libraryInfo) this.libraryInfo = this.opts.libraryInfo;
    if (this.opts.view) this.view = this.opts.view;
    if (this.opts.volume != null) this.volume = this.opts.volume;
    if (this.opts.keepOn != null) this.keepOn = !!this.opts.keepOn;
    if (this.opts.hideBar != null) this.hideBar = !!this.opts.hideBar;

    if (this.lrcBtn) this.lrcBtn.hidden = !this.opts.showLrcImport;
    this.count.textContent = this.tracks.length ? this.tracks.length + ' 首' : '';

    this.redraw();
  }

  redraw(){
    this.renderTracks();
    this.renderAlbums();
    this.renderArtists();
    this.renderPlaylists();
    this.renderSettings();
    this.syncTitle();
  }

  syncTitle(){
    const base = { tracks: '音乐库', albums: '专辑', artists: '艺术家', playlists: '歌单', settings: '设置' };
    let t = base[this.tab] || '音乐库';
    if (this.drill && this.drill.name) t = this.drill.name;
    this.titleEl.firstChild.textContent = t;
  }

  /* ---------------- 歌曲 ---------------- */

  renderTracks(){
    const o = this.opts || {};
    if (!this.tracks.length){
      this.list.innerHTML =
        '<div class="lib-empty"><b>还没有曲目</b>' +
        (o.emptyHint || '选择一个放音乐的文件夹，它会把里面的歌整理成一张唱片。') +
        '</div>';
      return;
    }
    const list = this.filtered();
    if (!list.length){
      this.list.innerHTML =
        '<div class="lib-empty"><b>没有匹配的曲目</b>' +
        '「' + esc(this.rawQuery()) + '」在标题、艺人和专辑里都没找到。' +
        '</div>';
      return;
    }
    this.list.innerHTML = this.trackRows(list, true);
  }

  rawQuery(){
    return (this.searchInput && this.searchInput.value.trim()) || this.query;
  }

  trackRows(list, numbered){
    const stats = allTrackStats();
    return list.map((t) => {
      const i = this.tracks.indexOf(t);
      const cur = i >= 0 && i === this.index ? ' is-cur' : '';
      const on = cur && this.playing ? ' is-on' : '';
      const bad = t.playable === false ? ' unsupported' : '';
      const dur = t.duration ? fmt(t.duration) : '--:--';
      const st = stats[t.id];
      const lv = levelInfo(qualityOf(t));
      return '<div class="tr' + cur + on + bad + '" data-i="' + i + '">' +
        '<span class="tr-n">' + (cur ? '▶' : numbered ? String(i + 1).padStart(2, '0') : '·') + '</span>' +
        '<span class="tr-body">' +
          '<span class="tr-t">' + esc(t.title || '未知曲目') +
            '<i class="badge" style="--c:' + lv.color + '">' + lv.name + '</i>' +
          '</span>' +
          '<span class="tr-a">' + esc([t.artist, t.album].filter(Boolean).join(' · ') || ' ') +
            (st && st.n ? ' · 播放 ' + st.n + ' 次' : '') +
          '</span>' +
        '</span>' +
        '<span class="eqmini"><i></i><i></i><i></i></span>' +
        '<span class="tr-add" data-add="' + esc(t.id) + '" title="加入歌单" role="button">+</span>' +
        '<span class="tr-d">' + dur + '</span>' +
      '</div>';
    }).join('');
  }

  onListClick(e){
    const add = e.target.closest('[data-add]');
    if (add){
      e.stopPropagation();
      this.hooks.onAddToPlaylist(add.dataset.add);
      return;
    }
    const row = e.target.closest('.tr');
    if (!row) return;
    const i = +row.dataset.i;
    if (i < 0) return;
    if (row.classList.contains('unsupported')){
      this.hooks.onUnsupported(this.tracks[i]);
      return;
    }
    this.hooks.onPlay(i);
    if (window.matchMedia('(orientation:portrait)').matches) this.close();
  }

  /* ---------------- 专辑 / 艺术家 ---------------- */

  groupRows(groups, kind, activeKey){
    if (!groups.length){
      if (this.query){
        return '<div class="lib-empty"><b>没有匹配的' + (kind === 'album' ? '专辑' : '艺术家') + '</b>' +
          '换个关键词试试。</div>';
      }
      return '<div class="lib-empty"><b>还没有' + (kind === 'album' ? '专辑' : '艺术家') + '</b>' +
        '曲目信息里没有' + (kind === 'album' ? '专辑名' : '艺术家') + '，补全标签后刷新即可分组。</div>';
    }
    return groups.map((g) => {
      const key = kind === 'album' ? (g.name || '未知专辑') : (g.name || '未知艺术家');
      const on = activeKey === key ? ' is-cur' : '';
      const initial = (key || '?').trim().slice(0, 1).toUpperCase();
      return '<div class="grp' + on + '" data-key="' + esc(key) + '">' +
        '<span class="grp-ico">' + esc(initial) + '</span>' +
        '<span class="tr-body">' +
          '<span class="tr-t">' + esc(key) + '</span>' +
          '<span class="tr-a">' + g.tracks.length + ' 首 · ' + fmtBytes(g.size) + ' · ' + fmtDuration(g.duration) + '</span>' +
        '</span>' +
        '<span class="grp-arrow">' + (on ? '▾' : '▸') + '</span>' +
      '</div>' +
      (on ? '<div class="grp-body">' + this.trackRows(g.tracks, false) + '</div>' : '');
    }).join('');
  }

  renderAlbums(){
    const groups = groupBy(this.filtered(), t => t.album || '未知专辑')
      .sort((a, b) => (a.name === '未知专辑') - (b.name === '未知专辑') || b.tracks.length - a.tracks.length);
    const key = this.drill && this.drill.kind === 'album' ? this.drill.key : '';
    this.lists.albums.innerHTML = this.groupRows(groups, 'album', key);
  }

  renderArtists(){
    const groups = groupBy(this.filtered(), t => t.artist || '未知艺术家')
      .sort((a, b) => b.tracks.length - a.tracks.length);
    const key = this.drill && this.drill.kind === 'artist' ? this.drill.key : '';
    this.lists.artists.innerHTML = this.groupRows(groups, 'artist', key);
  }

  onGroupClick(e, kind){
    const row = e.target.closest('.grp');
    if (row){
      const key = row.dataset.key;
      const same = this.drill && this.drill.kind === kind && this.drill.key === key;
      this.drill = same ? null : { kind, key, name: key };
      this.redraw();
      return;
    }
    // 展开后的曲目行
    const tr = e.target.closest('.tr');
    if (tr){
      const idx = +tr.dataset.i;
      if (idx >= 0) this.hooks.onPlay(idx);

  renderPlaylists(){
    if (!this.playlists.length){
      this.lists.playlists.innerHTML =
        '<div class="lib-empty"><b>还没有歌单</b>点上面「新建歌单」，然后在歌曲上长按或右键加入。</div>';
      return;
    }
    const active = this.drill && this.drill.kind === 'playlist' ? this.drill.key : '';
    const html = this.playlists.map((p) => {
      const on = active === p.id;
      const isFav = p.id === 'pl:fav';   // 「收藏」是固定歌单，图标用心形、不给删
      const secs = p.ids.reduce((s, id) => {
        const t = this.tracks.find(x => x.id === id);
        return s + (t ? (t.duration || 0) : 0);
      }, 0);
      const body = on
        ? '<div class="grp-body">' + this.playlistTracks(p) + '</div>'
        : '';
      return '<div class="grp' + (on ? ' is-cur' : '') + '" data-pl="' + p.id + '">' +
        '<span class="grp-ico' + (isFav ? ' is-fav' : '') + '">' + (isFav ? '♥' : '♪') + '</span>' +
        '<span class="tr-body">' +
          '<span class="tr-t">' + esc(p.name) + '</span>' +
          '<span class="tr-a">' + p.ids.length + ' 首 · ' + fmtDuration(secs) + '</span>' +
        '</span>' +
        '<span class="grp-arrow">' + (on ? '▾' : '▸') + '</span>' +
      '</div>' + body;
    }).join('');

    const cur = this.drill && this.drill.kind === 'playlist'
      ? this.playlists.find(p => p.id === this.drill.key) : null;
    const actions = cur && cur.id !== 'pl:fav'
      ? '<div class="pl-actions">' +
          '<button class="tool danger" data-act="delete">删除这个歌单</button>' +
        '</div>'
      : '';
    this.lists.playlists.innerHTML = html + actions;
  }

  playlistTracks(p){
    const list = p.ids.map(id => this.tracks.find(t => t.id === id)).filter(Boolean);
    if (!list.length) return '<div class="lib-empty small">这个歌单还是空的</div>';
    return list.map((t) => {
      const i = this.tracks.indexOf(t);
      return '<div class="tr" data-i="' + i + '" data-pl-rm="' + esc(t.id) + '">' +
        '<span class="tr-n">·</span>' +
        '<span class="tr-body">' +
          '<span class="tr-t">' + esc(t.title || '未知曲目') + '</span>' +
          '<span class="tr-a">' + esc(t.artist || '') + '</span>' +
        '</span>' +
        '<span class="tr-d">移除</span>' +
      '</div>';
    }).join('');
  }

  onPlaylistClick(e){
    const act = e.target.closest('[data-act]');
    if (act){
      this.hooks.onPlaylistAction(act.dataset.act, this.drill && this.drill.key);
      return;
    }
    const rm = e.target.closest('[data-pl-rm]');
    if (rm){
      e.stopPropagation();
      this.hooks.onRemoveFromPlaylist(this.drill.key, rm.dataset.plRm);
      return;
    }
    const grp = e.target.closest('.grp');
    if (grp){
      const id = grp.dataset.pl;
      const same = this.drill && this.drill.kind === 'playlist' && this.drill.key === id;
      const p = this.playlists.find(x => x.id === id);
      this.drill = same ? null : { kind: 'playlist', key: id, name: p ? p.name : '' };
      this.redraw();
      return;
    }
    const tr = e.target.closest('.tr');
    if (tr){
      const idx = +tr.dataset.i;
      if (idx >= 0) this.hooks.onPlay(idx);
    }
  }

/* ---- ui/perf.js ---- */
/* 性能看门狗：启动后测 3 秒帧时，p90 超过 22ms 就降档
   （安卓 WebView 上全屏噪点 / conic-gradient / 高 DPR canvas 是主要开销） */
function watchPerf(onLow){
  const samples = [];
  let start = 0;
  let last = 0;

  function frame(now){
    if (!start){ start = now; last = now; }
    const dt = now - last;
    last = now;

    // 跳过启动阶段（首帧布局、字体、音频初始化会污染样本）
    if (now - start > 1400 && dt < 400) samples.push(dt);

    if (now - start < 4200){
      requestAnimationFrame(frame);
      return;
    }
    if (samples.length < 40) return;
    samples.sort((a, b) => a - b);
    const p90 = samples[Math.floor(samples.length * 0.9)];
    if (p90 > 22) onLow(p90);
  }
  requestAnimationFrame(frame);
}

/* ================= 播放 ================= */
function ensureAudio(){
  if (backend.ensureAnalyser) backend.ensureAnalyser();
}

async function playIndex(i, autoplay){
  if (i < 0 || i >= S.tracks.length) return;
  flushListen();
  const tr = S.tracks[i];
  S.index = i;
  syncOrder(i);

  try {
    await resolvePlayable(tr);
  } catch (e){
    toast('无法播放：' + (tr.title || '') + (e && e.message ? '（' + e.message + '）' : ''));
    tr.playable = false;
    renderLib();
    return;
  }

  try {
    await backend.load(tr, S.tracks);
  } catch (e){
    toast('播放失败：' + (tr.title || ''));
    return;
  }

  S.duration = tr.duration || backend.duration || 0;
  paintMeta(tr);
  paintCover(tr);

  // 记一次播放（切歌、循环回到开头都算，内部有 20 秒去重）
  notePlay(tr);
  playAccum = 0;
  playAccumId = tr.id;

  const raw = await loadLyrics(tr);
  const lines = raw ? lrcToLines(raw, S.duration) : (tr.demo ? DEMO_LYRICS.slice() : []);
  lyricsView.setLines(lines);
  applyView();

  const r = getResume(tr.id);
  if (r > 2 && (!S.duration || r < S.duration - 3)) seekTo(r, false);
  else seekTo(0, false);

  library.updatePlaying(S.index, false);
  if (autoplay) await setPlaying(true);
  savePrefs();
}

async function setPlaying(on){
  if (!S.tracks.length) return;
  if (!on) flushListen();
  if (on){
    ensureAudio();
    const ok = await backend.play();
    if (ok === false){
      S.playing = false;
      document.body.classList.remove('is-playing');
      document.body.classList.add('needs-tap');
      library.updatePlaying(S.index, false);
      return;
    }
  } else {
    backend.pause();
  }
  S.playing = on;
  document.body.classList.toggle('is-playing', on);
  document.body.classList.remove('needs-tap');
  library.updatePlaying(S.index, on);
  const tr = currentTrack();
  if (tr) saveResume(tr.id, S.t);
}

function togglePlay(){ setPlaying(!S.playing); }

function seekTo(t, immediate){
  const dur = S.duration || backend.duration || 0;
  const v = clamp(t, 0, dur > 0 ? dur : t);
  S.t = v;
  backend.seek(v);
  lyricsView.snapTo(v);
  transport.update(v, dur, S.playing);
}

function paintScratch(d, t){
  $('scratchTime').textContent = fmtShort(t);
  $('scratchDir').textContent = d < -0.6 ? '◀◀' : d > 0.6 ? '▶▶' : '●';
}

function fmtShort(s){
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* ================= 队列 =================
   随机播放不是"每次随机取一个下标"——那样在「随机 + 不循环」时永远停不下来，
   也没法实现「上一首」。这里改成先把整库洗成一副牌（order），再按发牌顺序走。 */
let order = [];
let orderPos = 0;

function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* start >= 0：把它放第一位，其余洗牌；start = -1：整轮重新洗 */
function buildOrder(start){
  const n = S.tracks.length;
  const rest = [];
  for (let i = 0; i < n; i++) if (i !== start) rest.push(i);
  shuffleArr(rest);
  order = start >= 0 ? [start].concat(rest) : rest;
  orderPos = 0;
}

/* 用户点了某一首之后，把发牌位置对齐过去 */
function syncOrder(i){
  if (!S.shuffle) return;
  if (order.length !== S.tracks.length){ buildOrder(i); return; }
  const p = order.indexOf(i);
  if (p >= 0) orderPos = p;
  else buildOrder(i);
}

function nextIndex(dir){
  const n = S.tracks.length;
  if (!n) return -1;

  if (S.shuffle){
    if (order.length !== n || order.indexOf(S.index) < 0) buildOrder(S.index);
    const pos = orderPos + (dir > 0 ? 1 : -1);
    if (pos >= 0 && pos < order.length){
      orderPos = pos;
      return order[orderPos];
    }
    if (S.repeat === 'off') return -1;      // 一轮发完就停
    if (dir > 0){
      buildOrder(-1);                       // 重新洗牌开下一轮
      return order[0];
    }
    orderPos = order.length - 1;
    return order[orderPos];
  }

  const i = S.index + dir;
  if (i < 0) return S.repeat === 'off' ? -1 : n - 1;
  if (i >= n) return S.repeat === 'off' ? -1 : 0;
  return i;
}

function onEnded(){
  // 安卓侧 ExoPlayer 自己会往下走，只有队列真的播完才回到这里
  if (IS_ANDROID){ setPlaying(false); return; }
  if (S.repeat === 'one'){ seekTo(0); setPlaying(true); return; }
  const i = nextIndex(1);
  if (i < 0){ setPlaying(false); seekTo(0); return; }
  playIndex(i, true);
}

function goNext(){
  if (IS_ANDROID){ backend.next(); return; }
  const i = nextIndex(1);
  if (i >= 0) playIndex(i, S.playing);
}

function goPrev(){
  if (IS_ANDROID){ backend.prev(); return; }
  if (S.t > 3){ seekTo(0); return; }
  const i = nextIndex(-1);
  if (i >= 0) playIndex(i, S.playing);
}

/* 通知栏/锁屏切歌后，把 UI 拉回当前曲目（不重新 load 音频） */
async function syncTrack(index){
  if (index < 0 || index >= S.tracks.length || index === S.index) return;
  S.index = index;
  const tr = S.tracks[index];
  S.duration = tr.duration || S.duration;
  paintMeta(tr);
  paintCover(tr);
  const raw = await loadLyrics(tr);
  lyricsView.setLines(raw ? lrcToLines(raw, S.duration) : []);
  applyView();
  library.updatePlaying(index, S.playing);
}

function toggleShuffle(){
  S.shuffle = !S.shuffle;
  order = [];                 // 开关一次就重新洗牌
  transport.setShuffle(S.shuffle);
  if (IS_ANDROID) backend.setShuffle(S.shuffle);
  savePrefs();
  if (S.shuffle){
    buildOrder(S.index);
    toast('随机播放 · 打乱后' + (S.repeat === 'off' ? '播完一轮停'
      : S.repeat === 'one' ? '单曲反复' : '整轮循环'));
  } else {
    toast('顺序播放 · 按曲库顺序' + (S.repeat === 'off' ? '，播完停' : '循环'));
  }
}

function repeatText(mode){
  return mode === 'one' ? '单曲循环' : mode === 'all' ? '列表循环' : '不循环';
}

/* 循环模式：列表循环 → 单曲循环 → 不循环 → 列表循环
   与随机是正交的两件事：
     不循环     播到最后一首就停
     列表循环   播完一轮从头再来
     单曲循环   当前这首反复播
   随机开着时先把整库洗成一副牌，再按上面的规则走完这一轮。 */
function cycleRepeat(){
  S.repeat = S.repeat === 'all' ? 'one' : S.repeat === 'one' ? 'off' : 'all';
  transport.setRepeat(S.repeat);
  if (IS_ANDROID) backend.setRepeat(S.repeat);
  savePrefs();
  const detail = S.repeat === 'off' ? '播到最后一首就停'
    : S.repeat === 'one' ? '当前这首反复播'
    : '播完一轮从头再来';
  toast(repeatText(S.repeat) + ' · ' + detail +
    (S.shuffle ? '（随机开着：打乱顺序后按这个规则走）' : ''));
}

/* ================= 曲库 ================= */
function setLibrary(tracks, autoplay){
  S.tracks = (tracks || []).map(restoreImportedLyrics);
  S.source = 'library';
  order = [];                 // 曲库换了，随机牌堆作废
  renderLib();
  $('empty').classList.remove('show');

  if (!S.tracks.length){
    showEmpty();
    return;
  }

  const lastId = getLastId();
  let idx = S.tracks.findIndex(t => t.id === lastId);
  if (idx < 0) idx = 0;
  playIndex(idx, autoplay);
}

  $('empty').classList.add('show');
  $('emptyDemo').hidden = !IS_WEB;
}

function showRestoring(){

}

async function pick(){
  library.setBusy(true);
  try {
    const res = await pickLibrary();
    if (!res) return;
    if (!res.tracks.length && !res.dir) return;   // 用户取消
    if (res.dir){
      // 先把目录落盘：曲库大时第一首可能要转码，失败也不能把目录丢了
      S.folder = res.dir;
      savePrefs();
    }
    if (!res.tracks.length){
      toast(IS_ANDROID ? '没找到音乐，检查一下读取权限' : '这个文件夹里没有找到音频文件');
      return;
    }
    setLibrary(res.tracks, false);
    toast('找到 ' + res.tracks.length + ' 首');
  } catch (e){
    toast('扫描失败：' + (e && e.message ? e.message : e));
  } finally {
    library.setBusy(false);
  }
}

async function doRescan(){
  library.setBusy(true);
  try {
    const res = await rescan(S.folder);
    if (res && res.tracks){
      const curId = currentTrack() ? currentTrack().id : '';
      S.tracks = res.tracks;
      order = [];
      renderLib();
      if (!S.tracks.length) showEmpty();
      const i = S.tracks.findIndex(t => t.id === curId);
      if (i >= 0 && i !== S.index) S.index = i;
      toast('已刷新 · ' + S.tracks.length + ' 首');
    }
  } catch (e){
    // 目录被删/移动/U 盘拔了：清掉记忆，下次让用户重选
    if (IS_DESKTOP && S.folder){
      S.folder = '';
      savePrefs();
      showEmpty();
      toast('上次的文件夹找不到了，请重新选择');
    } else {
      toast('刷新失败');
    }
  } finally {
    library.setBusy(false);
  }
}

async function doImportLyrics(){

/* ================= 提示 ================= */
let toastTimer = 0;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ================= 渲染循环 ================= */
let last = performance.now();
let saveTick = 0;
let playAccum = 0;      // 待结算的收听秒数
let playAccumId = '';

function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!disc.scratching && !S.scrubbing && S.playing){
    S.t = backend.time;
  }
  const bd = backend.duration;
  if (bd > 0 && Math.abs(bd - S.duration) > 0.6) S.duration = bd;

  disc.tick(dt, S.playing);
  backend.pull();

  transport.update(S.t, S.duration || bd, S.playing);

  const i = lyricsView.indexAt(S.t);
  if (i >= 0) lyricsView.setActive(i);
  if (viewMode() === 'visual') spectrum.draw(S.playing);

  // 收听时长按「实际在播」的墙钟累加，5 秒结算一次
  if (S.playing && !disc.scratching && !S.scrubbing){
    playAccum += dt;
    if (playAccum >= 5){
      const tr = currentTrack();
      if (tr) addSeconds(tr, playAccum);
      playAccum = 0;
    }
  }

  saveTick += dt;
  if (saveTick > 8 && S.playing){
    saveTick = 0;
    const tr = currentTrack();
    if (tr) saveResume(tr.id, S.t);
  }

  requestAnimationFrame(loop);
}

/* 切歌/暂停时把零头结算掉，不然最后几秒会丢 */
function flushListen(){
  if (playAccum >= 1 && playAccumId){
    const tr = S.tracks.find(t => t.id === playAccumId);
    if (tr) addSeconds(tr, playAccum);
  }
  playAccum = 0;
}

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.code === 'Space'){ e.preventDefault(); ensureAudio(); togglePlay(); }
  else if (e.code === 'ArrowRight'){ seekTo(S.t + 5, true); }
  else if (e.code === 'ArrowLeft'){ seekTo(S.t - 5, true); }
  else if (e.code === 'ArrowUp'){ e.preventDefault(); lyricsView.setActive(Math.max(0, lyricsView.active - 1)); }
  else if (e.code === 'ArrowDown'){ e.preventDefault(); lyricsView.setActive(Math.min(lyricsView.els.length - 1, lyricsView.active + 1)); }
  else if (e.key === 'l' || e.key === 'L'){ library.toggle(); }
  else if (e.key === '/'){
    e.preventDefault();
    library.open();
    library.focusSearch();
  }
});

/* ================= 安卓事件（原生桥 → JS） ================= */
function onPositionEvent(p){
  backend.onPosition((p && p.position) || 0, (p && p.duration) || 0, !!(p && p.playing));
}

function onSpectrumEvent(a){
  backend.onSpectrum(a);
}

function onStateEvent(s){
  const state = typeof s === 'string' ? s : (s && s.state) || '';
  backend.onState(state);
  if (state === 'ended'){ onEnded(); return; }
  if (state === 'playing' && !S.playing){
    S.playing = true;
    document.body.classList.add('is-playing');
    library.updatePlaying(S.index, true);
  }
  if ((state === 'paused' || state === 'idle') && S.playing){
    S.playing = false;
    document.body.classList.remove('is-playing');
    library.updatePlaying(S.index, false);
  }
}

function onCommandEvent(c){
  const cmd = typeof c === 'string' ? c : (c && c.command) || '';
  if (cmd === 'next'){ const i = nextIndex(1); if (i >= 0) playIndex(i, true); }
  else if (cmd === 'prev'){ const i = nextIndex(-1); if (i >= 0) playIndex(i, true); }
  else if (cmd === 'pause'){ setPlaying(false); }
  else if (cmd === 'play'){ setPlaying(true); }
}

/* 原生把安全区推过来（单位已经是 CSS 像素）。
   WebView 不解 env(safe-area-inset-*)，只能由壳子算好塞进 CSS 变量：
   状态栏 / 手势条底下要留白，但背景仍然铺满整屏，做到"内容让开、底色不留缝"。 */
window.__setInsets = (t, b, l, r) => {
  const s = document.documentElement.style;
  s.setProperty('--safe-t', (t || 0) + 'px');
  s.setProperty('--safe-b', (b || 0) + 'px');
  s.setProperty('--safe-l', (l || 0) + 'px');
  s.setProperty('--safe-r', (r || 0) + 'px');
  document.body.classList.add('has-insets');
};

/* 安卓壳通过 evaluateJavascript 调这里 */
window.__playerEvent = (name, payload) => {
  if (name === 'position') onPositionEvent(payload);
  else if (name === 'spectrum') onSpectrumEvent(payload);
  else if (name === 'state') onStateEvent(payload);
  else if (name === 'command') onCommandEvent(payload);
  else if (name === 'track') syncTrack(payload && payload.index);
  else if (name === 'toast') toast(typeof payload === 'string' ? payload : '');
};

/* 安卓返回键：先关曲库，再退到后台（不杀播放） */
window.__back = () => {
  if (library.isOpen){ library.close(); return true; }
  return false;
};

/* 权限刚授予时重新拉一次曲库 */
window.__rescan = async () => {
  if (!IS_ANDROID) return;
  try {
    const res = await rescan('');
    if (res && res.tracks.length){
      if (!S.tracks.length) setLibrary(res.tracks, false);
      else {
        S.tracks = res.tracks;
        renderLib();
      }
    }
  } catch (_) {}
};

/* ================= 启动 ================= */
async function boot(){
  loadPrefs();
  ensureFavorites();   // 「收藏」歌单先建出来，歌单页里始终在
  paintFav(currentTrack());
  // ?view=visual / ?view=lyrics 强制指定视图，调试和无头截图用
  try {
    const v = new URLSearchParams(location.search).get('view');
    if (v === 'visual' || v === 'lyrics') S.view = v;
  } catch (_) {}
  document.body.classList.add(IS_ANDROID ? 'is-android' : IS_DESKTOP ? 'is-desktop' : 'is-web');

  // 按钮文案按平台走：安卓是扫系统媒体库，不是"选文件夹"
  if (IS_ANDROID){
    $('pickBtn').textContent = '扫描本机音乐';
    $('rescanBtn').textContent = '重新扫描';
    $('emptyPick').textContent = '扫描手机音乐';
  } else {
    $('pickBtn').textContent = '选择音乐文件夹';
    $('rescanBtn').textContent = '刷新';
    $('emptyPick').textContent = '选择文件夹';
  }

  transport.setVolume(S.volume);
  transport.setShuffle(S.shuffle);
  transport.setRepeat(S.repeat);
  backend.setVolume(S.volume);
  applyScreenPrefs();   // 常亮 / 隐藏状态栏：开机就按上次的选择恢复

  if (IS_ANDROID){
    await listen('player://position', onPositionEvent);
    await listen('player://spectrum', onSpectrumEvent);
    await listen('player://state', onStateEvent);
    await listen('player://command', onCommandEvent);
  }

  watchPerf((p90) => {
    S.perfLow = true;
    document.body.classList.add('perf-low');
    spectrum.setLow(true);
    spectrum.size();
    console.info('[vinyl] 性能降档 p90=' + p90.toFixed(1) + 'ms');
  });

  requestAnimationFrame(loop);

  if (IS_WEB){
    S.tracks = [DEMO];
    S.index = 0;
    S.source = 'demo';
    renderLib({ showLrcImport: false });
    await playIndex(0, false);
    setTimeout(() => { if (!S.playing) setPlaying(true); }, 700);
    logBoot('boot: web demo');
    return;
  }

  if (IS_DESKTOP){
    logBoot('boot: desktop, folder=' + (S.folder || '-'));
    if (S.folder){
      // 大曲库扫描要几秒，先给个占位，别让用户以为曲库丢了
      showRestoring();
      try {
        const res = await rescan(S.folder);
        if (res && res.tracks.length){
          setLibrary(res.tracks, false);
          $('empty').classList.remove('show');
          logBoot('boot: restored ' + res.tracks.length + ' tracks');
          return;
        }
        logBoot('boot: rescan empty');
      } catch (e){
        logBoot('boot: rescan failed ' + (e && e.message));
        // 目录不在了，清掉记忆，避免每次启动都白扫一遍
        S.folder = '';
        savePrefs();
      }
    }
    showEmpty();
    logBoot('boot: empty state');
    return;
  }

  showRestoring();
  try {
    const res = await rescan('');
    if (new URLSearchParams(location.search).has('diag')){
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:6px;top:56px;right:6px;z-index:99;font:10px monospace;color:#fff;background:rgba(0,0,0,.8);padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-all;line-height:1.5';
      let probeTxt = 'n/a';
      let keysTxt = 'n/a';
      let rawTxt = 'n/a';
      const A = window.AndroidPlayer || {};
      try {
        keysTxt = 'probe=' + (typeof A.probe) +
          ' ping=' + (typeof A.ping) +
          ' library=' + (typeof A.library) +
          ' arity.probe=' + (A.probe ? A.probe.length : '?') +
          ' arity.ping=' + (A.ping ? A.ping.length : '?');
      } catch (e){ keysTxt = 'ERR ' + e; }
      // 三种调用方式对照，定位是"调用不通"还是"方法体炸了"
      try { rawTxt = 'direct=' + String(A.probe('{}')); } catch (e){ rawTxt = 'direct THREW ' + (e && (e.message || e)); }
      try { rawTxt += ' | apply=' + String(A.probe.apply(A, ['{}'])); } catch (e){ rawTxt += ' | apply THREW ' + (e && (e.message || e)); }
      try { rawTxt += ' | ping=' + String(A.ping('{}')); } catch (e){ rawTxt += ' | ping THREW ' + (e && (e.message || e)); }
      // 直接看 library() 原始返回
      try {
        const libRaw = String(A.library('{}') || '');
        let parsed = 'unparsed';
        try { const j = JSON.parse(libRaw); parsed = 'parsed len=' + j.length; } catch (pe){ parsed = 'PARSE FAIL: ' + (pe && pe.message); }
        rawTxt += ' | lib.len=' + libRaw.length + ' | lib.' + parsed + ' | head=' + libRaw.slice(0, 150);
      } catch (e){ rawTxt += ' | lib THREW ' + (e && (e.message || e)); }
      try { probeTxt = acall('probe') || 'null'; } catch (e){ probeTxt = 'ERR ' + e; }
      d.textContent = 'bridge=' + HAS_ANDROID + ' android=' + IS_ANDROID +
        ' tracks=' + (res ? res.tracks.length : 'null') +
        '\nprobe=' + probeTxt +
        '\nkeys=' + keysTxt +
        '\nraw=' + rawTxt;
      document.body.appendChild(d);
    }
    if (res && res.tracks.length){
      setLibrary(res.tracks, false);
      $('empty').classList.remove('show');
    } else {
      showEmpty();
    }
    logBoot('boot: android tracks=' + S.tracks.length);
  } catch (e){
    showEmpty();
    logBoot('boot: android scan failed');
  }
}

function logBoot(msg){
  try {
    if (IS_DESKTOP) invoke('log_line', { msg: msg });
  } catch (_) {}
}

window.addEventListener('error', (e) => {
  const msg = 'JS ERROR: ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0);
  logBoot(msg);
  document.title = msg;
  if (S.tracks.length === 0) toast('出错了：' + (e.message || '脚本异常'));
});

window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  const msg = 'REJECT: ' + ((r && (r.stack || r.message)) || String(r));
  logBoot(msg);
  document.title = msg.slice(0, 180);
});

boot().then(() => {
  // ?lib=1 直接打开音乐库，?tab=settings 指定页签
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('lib')){
      const el = $('sheet');
      const sc = $('scrim');
      // 无头截图时 CSS 过渡可能不推进，直接跳到位
      el.style.transition = 'none';
      sc.style.transition = 'none';
      library.open();
      const t = q.get('tab');
      if (t) library.setTab(t);
      setTimeout(() => { el.style.transition = ''; sc.style.transition = ''; }, 60);
    }
  } catch (_) {}
});

/* 诊断：访问 ?diag 时把关键盒子尺寸写进 title，便于无头浏览器取值 */
if (location.search.indexOf('diag') >= 0){
  setTimeout(() => {
    const r = (sel) => {
      const e = typeof sel === 'string' && sel[0] === '#' ? $(sel.slice(1)) : document.querySelector(sel);
      if (!e) return null;
      const b = e.getBoundingClientRect();
      return [Math.round(b.x), Math.round(b.y), Math.round(b.width), Math.round(b.height)];
    };
    document.title = JSON.stringify({
      vw: innerWidth, vh: innerHeight,
      stage: r('.stage'), deck: r('#deck'), platter: r('#platter'),
      panel: r('.panel'), lyrics: r('#lyrics'), track: r('#lyricTrack'),
      libBtn: r('#libBtn'), row: r('.row'), tf: ($('lyricTrack') || {}).style.transform || '',
      controls: r('.controls'), btns: r('.btns'), play: r('#play'),
      hwbr: r('.hw.br'), knob: r('#viewToggle'), volknob: r('#volKnob'),
      sheet: r('#sheet'), tabs: r('#sheetTabs'), settings: r('#settingsPane'), cards: r('.stat-cards'), card1: r('.stat-card'), group: r('.set-group')
    });
  }, 1800);
}

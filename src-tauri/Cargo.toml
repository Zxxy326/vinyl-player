[package]
name = "vinyl-player"
version = "2.0.0"
description = "Vinyl Player — lightweight local music player"
authors = ["Zxxy326"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vinyl_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"
symphonia = { version = "0.5", features = ["all"] }
hound = "3"
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

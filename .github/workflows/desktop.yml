name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: node scripts/build-web.mjs

      - name: Install Tauri CLI
        run: npm install

      - name: Build app
        run: npx tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/vinyl-player.exe out/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: vinyl-player-windows
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

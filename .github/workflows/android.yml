name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # secrets 不能直接用于 step 的 if，先落到 job 级 env 再判断
    env:
      VP_KEYSTORE_B64: ${{ secrets.VP_KEYSTORE_B64 }}
      VP_STORE_PASS: ${{ secrets.VP_STORE_PASS }}
      VP_KEY_ALIAS: ${{ secrets.VP_KEY_ALIAS }}
      VP_KEY_PASS: ${{ secrets.VP_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build frontend into app assets
        run: node scripts/build-web.mjs

      - name: Decode keystore
        if: env.VP_KEYSTORE_B64 != ''
        run: |
          mkdir -p android/keystore
          printf '%s' "$VP_KEYSTORE_B64" | base64 -d > android/keystore/vinyl-player.jks
          ls -l android/keystore/vinyl-player.jks

      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            for f in out/*.apk; do mv "$f" "out/vinyl-player-${GITHUB_REF_NAME#v}.apk"; done
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: vinyl-player-android
          path: out/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
